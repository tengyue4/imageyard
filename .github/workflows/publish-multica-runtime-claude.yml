name: Publish Multica Claude Runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-multica-runtime-claude.yml"
      - "multica-runtime/claude.Dockerfile"
      - "multica-runtime/claude-entrypoint.sh"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-multica-runtime-claude
  cancel-in-progress: false

env:
  IMAGE_NAME: multica-runtime-claude
  IMAGE_TAG: v0.4.21-claude-2.1.220-r1

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner_lc=${owner_lc}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner_lc}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable tag
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail

          inspect_log="$(mktemp)"
          trap 'rm -f "$inspect_log"' EXIT

          if docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}" >"$inspect_log" 2>&1; then
            cat "$inspect_log"
            echo "::error title=Immutable image tag already exists::Refusing to overwrite ${IMAGE}:${IMAGE_TAG}"
            exit 1
          fi

          if grep -Fxq "ERROR: ${IMAGE}:${IMAGE_TAG}: not found" "$inspect_log"; then
            echo "Immutable tag is available: ${IMAGE}:${IMAGE_TAG}"
            exit 0
          fi

          cat "$inspect_log" >&2
          echo "::error title=Unable to verify image tag::Refusing to publish because ${IMAGE}:${IMAGE_TAG} availability could not be confirmed"
          exit 1

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: multica-runtime
          file: multica-runtime/claude.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.title=Multica Claude Runtime
            org.opencontainers.image.description=Claude Code-first Multica daemon runtime image for Kubernetes-hosted agents
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
